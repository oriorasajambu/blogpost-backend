name: Backend foundation validation
description: Secret-free checks using the pinned runtime and disposable PostgreSQL.
runs:
  using: composite
  steps:
    - shell: bash
      run: npm ci
    - shell: bash
      run: npm run build:native
    - shell: bash
      run: npm run test:ci
    - shell: bash
      run: npm run security:test
    - shell: bash
      run: npm run test:build
    - shell: bash
      run: npm run test:deploy
    - shell: bash
      run: npm run db:validate
    - shell: bash
      run: npm run db:generate
    - shell: bash
      run: npm run contract:build -- --check
    - shell: bash
      run: npm run contract:typescript -- --check
    - shell: bash
      run: npm run contract:compatibility:test
    - shell: bash
      run: npm run format:check
    - shell: bash
      run: npm run typecheck
    - shell: bash
      run: npm test
    - shell: bash
      run: npm run mock:smoke
    - shell: bash
      run: node scripts/contract-manifest.mjs --check
    - shell: bash
      run: npm run contract:package
    - shell: bash
      run: npm run contract:package -- --check
    - shell: bash
      run: npm run contract:package:verify -- .local/contracts/blogpost-api-contract-1.0.0/blogpost-api-contract-1.0.0.tar.gz
    - shell: bash
      run: npm run db:bootstrap
      env:
        SQL_ROOT_PASSWORD: disposable-ci-root
        SQL_MIGRATOR_PASSWORD: disposable-ci-migrator
    - shell: bash
      run: npm run db:migrate
      env:
        SQL_MIGRATOR_PASSWORD: disposable-ci-migrator
    - shell: bash
      run: npm run db:migrate
      env:
        SQL_MIGRATOR_PASSWORD: disposable-ci-migrator
    - shell: bash
      run: npm run db:verify
    - shell: bash
      run: npm run test:integration
    - shell: bash
      run: npm run build
    # Production dependencies stay at moderate. Dev-only tooling (the contract
    # generator's @redocly/openapi-core pins minimatch 5.1.9) and the dev/CI-only
    # Firebase emulator image (docker/auth) fail only on high+ until fixes for
    # GHSA-g3hv-75wg-m249 (minimatch) and GHSA-3g3m-2fjr-6pw4 (glob) ship
    # upstream; restore moderate then (added 2026-11-03).
    - shell: bash
      run: npm audit --omit=dev --audit-level=moderate
    - shell: bash
      run: npm audit --audit-level=high
    - shell: bash
      run: npm audit --prefix docker/auth --audit-level=high
    - shell: bash
      run: npm audit --prefix docker/operations --audit-level=moderate
    - shell: bash
      run: npm audit --prefix tools/mock --audit-level=moderate
